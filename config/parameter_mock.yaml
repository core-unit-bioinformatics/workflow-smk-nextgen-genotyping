
# Reference files for PanGenie and locityper
# See the PanGenie documentation/wiki for more details:
# https://github.com/eblerjana/pangenie/wiki/D:-Running-PanGenie-on-HPRC-data

# The linear reference genome (pangenie, locityper) such as hg38 or chm13/T2T
# is expected to be in fasta format, and may optionally be gzipped.
# Valid example input file:
# https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/HGSVC2/technical/reference/20200513_hg38_NoALT/hg38.no_alt.fa.gz
linear_reference_genome:
  label: MOCKgenome
  path: mock_linear_reference_genome.fasta

# The pangenome reference graph (pangenie, locityper) is expected to be a variation graph in vcf format,
# and may optionally be gzipped.
# Valid example input file:
# https://s3-us-west-2.amazonaws.com/human-pangenomics/pangenomes/scratch/2025_02_28_minigraph_cactus/hprc-v2.0-mc-grch38/hprc-v2.0-mc-grch38.pgin.vcf.gz
pangenome_reference_graph:
  label: MOCKpangen
  path: mock_pangenome_reference_graph.vcf

# The reference callset  (pangenie)is expected to be in vcf format, and may optionally be gzipped.
# Valid example input file:
# https://s3-us-west-2.amazonaws.com/human-pangenomics/pangenomes/scratch/2025_02_28_minigraph_cactus/hprc-v2.0-mc-grch38/hprc-v2.0-mc-grch38.pgbi.vcf.gz
reference_callset:
  label: MOCKcalls
  path: mock_reference_callset.vcf

# The loci catalog  (locityper)is expected to be in bed format. Tab separated, with 3 columns: 
# chrom, start, end, optional name.
# Valid example input file can be found here:
# https://zenodo.org/records/11068261
loci_catalog:
  label: MOCKlociset
  path: mock_loci.bed

# The CRAM reference genome (locityper) is expected to be in fasta format, and may optionally be gzipped.
# Valid example input file:
# https://42basepairs.com/browse/s3/1000genomes/technical/reference/GRCh38_reference_genome?file=GRCh38_full_analysis_set_plus_decoy_hla.fa
cram_reference_genome:        # for locityper only
  label: MOCKcram
  path: mock_cram_reference_genome.fasta

# HPRC assemblies packed in an AGC archive (locityper) 
# Only required when graph_type=agc. Replaces the pangenome reference graph for locityper then (the graph is still needed for pangenie). 
# Valid example input file: 
# https://s3-us-west-2.amazonaws.com/human-pangenomics/index.html?prefix=submissions/B4174A5F-F20E-4DCF-8470-F8A907B640BC--HPRCv2_0.6.1_pr_agc_submission/
hprc_assemblies:
  label: MOCKassemblies
  path: mock_HPRC_r2_assemblies_0.6.1.agc

# Genome/assembly name aliases for the above HPRC assemblies (locityper), mapping each assembly's raw internal name to a short haplotype name
# Only required when graph_type=agc.
# Valid example input file:
# https://locityper.vercel.app/data/HPRC_r2_assemblies_0.6.1.aliases (https://locityper.vercel.app/target)
assembly_aliases:
  label: MOCKaliases
  path: mock_HPRC_r2_assemblies_0.6.1.aliases

# Specify which tools to run in the pipeline. Options are: pangenie, locityper
# This can also be set via --config tools=... on the CLI instead
tools: "pangenie,locityper"

# For locityper only: which route to use for building its loci
# database. Options are: 
# 1. vcf (default - uses pangenome_reference_graph).
# 2. agc (uses hprc_assemblies + assembly_aliases instead, no pangenome
# graph needed unless pangenie is also selected).
# This can also be set via --config graph_type=... on the CLI instead
graph_type: "vcf"


# Config options to use reference container
# as part of the pipeline
use_reference_container: false
# If use_reference_container is set to true, the following
# two options must be specified as well in the config

# Existing path to directory with reference container (*.sif) files.
# This option is specific to the execution infrastructure.
# reference_container_store: <PATH>

# List of container names to be used in the pipeline
# reference_container_names:
#   - name1
#   - name2
