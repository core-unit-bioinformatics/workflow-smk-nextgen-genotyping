# Reference files for PanGenie and locityper
# See the PanGenie documentation/wiki for more details:
# https://github.com/eblerjana/pangenie/wiki/D:-Running-PanGenie-on-HPRC-data

# The linear reference genome (pangenie, locityper) such as hg38 or chm13/T2T
# is expected to be in fasta format, and may optionally be gzipped.
# Valid example input file:
# https://ftp.1000genomes.ebi.ac.uk/vol1/ftp/data_collections/HGSVC2/technical/reference/20200513_hg38_NoALT/hg38.no_alt.fa.gz
linear_reference_genome:
  label: hg38
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/hg38.no_alt.fa.gz
  
# The pangenome reference graph (pangenie, locityper) is expected to be a variation graph in vcf format,
# and may optionally be gzipped.
# Valid example input file:
# https://s3-us-west-2.amazonaws.com/human-pangenomics/pangenomes/scratch/2025_02_28_minigraph_cactus/hprc-v2.0-mc-grch38/hprc-v2.0-mc-grch38.pgin.vcf.gz
pangenome_reference_graph:
  label: hprc21grch38graph
#  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/hprc-v2.0-mc-grch38.pgin.vcf.gz
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/hprc-v2.1-mc-grch38_filtered_ids.vcf.gz

# The reference callset  (pangenie)is expected to be in vcf format, and may optionally be gzipped.
# Valid example input file:
# https://s3-us-west-2.amazonaws.com/human-pangenomics/pangenomes/scratch/2025_02_28_minigraph_cactus/hprc-v2.0-mc-grch38/hprc-v2.0-mc-grch38.pgbi.vcf.gz
reference_callset:
  label: hprc21grch38callset
#  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/hprc-v2.0-mc-grch38.pgbi.vcf.gz
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/hprc-v2.1-mc-grch38_filtered_ids_biallelic.vcf.gz

# The loci catalog  (locityper)is expected to be in bed format. Tab separated, with 3 columns: 
# chrom, start, end, optional name.
# Valid example input file:
# https://zenodo.org/records/11068261
loci_catalog:
  label: clientlociset
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/2026-07-20_MODY_gene-list_padded.bed
  
# The CRAM reference genome (locityper) is expected to be in fasta format, and may optionally be gzipped.
# Valid example input file:
# https://42basepairs.com/browse/s3/1000genomes/technical/reference/GRCh38_reference_genome?file=GRCh38_full_analysis_set_plus_decoy_hla.fa
cram_reference_genome:        # for locityper only
  label: grch38decoyhla 
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/GRCh38_full_analysis_set_plus_decoy_hla.fa.gz

# HPRC assemblies packed in an AGC archive (locityper) 
# Only required when graph_type=agc. Replaces the pangenome reference graph for locityper then (the graph is still needed for pangenie). 
# Valid example input file: 
# https://s3-us-west-2.amazonaws.com/human-pangenomics/index.html?prefix=submissions/B4174A5F-F20E-4DCF-8470-F8A907B640BC--HPRCv2_0.6.1_pr_agc_submission/
hprc_assemblies:
  label: hprc061assemblies
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/HPRC_r2_assemblies_0.6.1.agc

# Genome/assembly name aliases for the above HPRC assemblies (locityper), mapping each assembly's raw internal name to a short haplotype name
# Only required when graph_type=agc.
# Valid example input file:
# https://locityper.vercel.app/data/HPRC_r2_assemblies_0.6.1.aliases (https://locityper.vercel.app/target)
assembly_aliases:
  label: hprc061aliases
  path: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/HPRC_r2_assemblies_0.6.1.aliases

# For locityper only: which route to use for building its loci
# database. Options are: 
# 1. vcf (default - uses pangenome_reference_graph).
# 2. agc (uses hprc_assemblies + assembly_aliases instead, no pangenome
# graph needed unless pangenie is also selected).
# This can also be set via --config graph_type=... on the CLI instead
graph_type: "vcf"

# KaryoScope feature sets to annotate IN ADDITION to chromosome and gene.
# Options: region, repeat, acrocentric, subtelomeric (comma-separated, empty = none)
# This can also be set via --config karyo-features=... on the CLI instead
karyo-features: ""

# KaryoScope (read-level k-mer annotation)
karyoscope:
  # local .sif, or a registry URI Snakemake pulls itself (oras://..., server with internet)
  container: /gpfs/project/projects/medbioinf/projects/cubi/projects/nextgen-genotyping/workdirs/wd/input_data/karyoscope_2.3.0.sif
  database: HKS_human_CHM13_v2
  # checked when a hand-copied tarball is found in local_ref/karyoscope/
  database_sha256: 4da29c348aaf4bc0808adb036c8557827bee798eb306cb0030f351d0a88b977b
  # shown in the error message for a manual download
  database_url: "https://zenodo.org/records/21150216/files/HKS_human_CHM13_v2.tar.gz?download=1"
  # keep the large per-read BEDs after summarizing (false = temp())
  keep_read_annotations: true
  # sex call, part 1 - Y: chrY bp per million autosomal bp 
  # >= male_y_ppm: Y present; 
  # <= female_y_ppm: Y absent; in between: ambiguous
  male_y_ppm: 1000
  female_y_ppm: 500
  # sex call, part 2 - X: expected chrX ppm of autosomal bp for TWO X copies
  # (chrX_copies = 2 * chrX_ppm / x_diploid_ppm); a copy estimate further
  # than x_copy_tolerance from a whole number is called ambiguous
  x_diploid_ppm: 53000
  x_copy_tolerance: 0.25
  # expected chrY ppm of autosomal bp for ONE Y copy, only used for the
  # chrY_copies column (the Y part of the sex call uses the ppm thresholds);
  # rough estimate - set it to chrY_ppm of the first confirmed XY sample
  y_haploid_ppm: 3500

# Maximum total temp disk space (in MB) the workflow may use at once
# for PanGenie/locityper temp() outputs. Defaults to 700000 (~700GB,
# covers ~5 concurrent samples) if not set.
# This can also be set via --config max_temp_disk_mb=... on the CLI instead
### max_temp_disk_mb: 700000

# Per-rule temp disk budgets (in MB), used as the disk_mb resource on
# PanGenie's and locityper's temp-producing/temp-consuming rules.
# Defaults (if not set): 40000 (~40GB) for PanGenie's temp VCF,
# 100000 (~100GB) for locityper's concatenated FASTQ temp files.
# Size these to your own data - measure actual temp file sizes for a
# few representative samples and add a safety margin (e.g. ~30% over
# the largest observed size).
# These can also be set via --config max_temp_pangenie=... /
# max_temp_locityper=... on the CLI instead
### max_temp_pangenie_mb: 40000
### max_temp_locityper_mb: 100000

# Config options to use reference container
# as part of the pipeline
use_reference_container: false
# If use_reference_container is set to true, the following
# two options must be specified as well in the config

# Existing path to directory with reference container (*.sif) files.
# This option is specific to the execution infrastructure.
# reference_container_store: <PATH>

# List of container names to be used in the pipeline
# reference_container_names:
#   - name1
#   - name2
